[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alfandy Surya", email = "alfandy.surya@finansia.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers[torch]>=5.20.2",
]

[project.scripts]
llm-from-scratch = "llm_from_scratch:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
